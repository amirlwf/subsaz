name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run test suite (gate — no release without green tests)
        run: python tests/test_all.py

      - name: Fetch portable ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-dl
          $bin = Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName assets/bin/ffmpeg.exe
          $probe = Get-ChildItem ffmpeg-dl -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $probe.FullName assets/bin/ffprobe.exe

      - name: Check prebuilt web frontend (web_dist is committed)
        shell: pwsh
        run: |
          if (-not (Test-Path web_dist/index.html)) {
            Write-Host "web_dist missing — rebuild with: cd web; npm install --include=dev; npm run build"
            exit 1
          }

      - name: Build with PyInstaller
        run: |
          pyinstaller subsaz-gui.spec
          pyinstaller subsaz-cli.spec
          pyinstaller subsaz-web.spec

      - name: Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SubSaz/* -DestinationPath SubSaz-portable-win64.zip
          Compress-Archive -Path dist/subsaz-cli/* -DestinationPath SubSaz-cli-win64.zip
          Compress-Archive -Path dist/SubSaz-Web/* -DestinationPath SubSaz-Web-win64.zip

      - name: Inno Setup installer
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/subsaz.iss

      # one download with everything: classic UI, WebView UI and the installer
      - name: All-in-one pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pack | Out-Null
          Copy-Item -Recurse dist/SubSaz pack/SubSaz
          Copy-Item -Recurse dist/SubSaz-Web pack/SubSaz-Web
          Copy-Item release/SubSaz-Setup-*.exe pack/
          @"
          SubSaz all-in-one pack

          SubSaz-Setup-*\.exe   installer (classic UI + WebView UI in subfolder "web")
          SubSaz\SubSaz.exe             portable classic (Tk) interface
          SubSaz-Web\SubSaz-Web.exe     portable TypeScript / WebView2 interface
          SubSaz-cli\  (see SubSaz-cli-win64.zip for the command line tool)

          The WebView2 interface needs the Windows 10/11 WebView2 runtime
          (preinstalled on Win 11, auto-installed by the setup otherwise).
          "@ | Out-File -FilePath pack/README.txt -Encoding utf8
          Compress-Archive -Path pack/* -DestinationPath SubSaz-All-win64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            SubSaz-All-win64.zip
            SubSaz-portable-win64.zip
            SubSaz-cli-win64.zip
            SubSaz-Web-win64.zip
            release/SubSaz-Setup-*.exe
